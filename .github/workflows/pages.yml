name: Web site

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # A prebuilt binary, at the version Cargo.lock pins (compiling it takes minutes).
      - name: Find the wasm-bindgen version in Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
          echo "wasm-bindgen $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      # The davilize CLI is not built here (it compiles DuckDB, the slowest step by far), so the
      # site has no rendered samples; the app opens its own sample report.
      - name: Build the site
        run: bash scripts/build-site.sh

      # The built site is tested in a real browser before it can be deployed.
      - name: Find the Playwright version
        id: playwright
        working-directory: app
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the test browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the test browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Install the test browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: npx playwright install-deps chromium

      - name: Browser tests
        working-directory: app
        run: npx playwright test

      - name: Keep the test report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
