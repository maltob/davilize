[package]
name = "dv-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Browser (WebAssembly) bindings for reading and checking Davilize reports"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dv-core = { path = "../dv-core" }
dv-sql = { path = "../dv-sql" }
dv-render = { path = "../dv-render" }
# No `pbix` feature: its SQLite and XPress9 C code does not build for WebAssembly.
dv-interop = { path = "../dv-interop", default-features = false }
arrow.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"
