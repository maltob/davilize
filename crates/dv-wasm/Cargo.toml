[package]
name = "dv-wasm"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Browser (WebAssembly) bindings for reading and checking Davilize reports"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dv-core = { path = "../dv-core" }
dv-sql = { path = "../dv-sql" }
dv-render = { path = "../dv-render" }
# Building for WebAssembly needs the C flags from scripts/wasm-env.sh (XPress9 needs a libc shim).
dv-interop = { path = "../dv-interop" }
arrow.workspace = true
chrono.workspace = true
# Reads SQLite files for database sources in the browser (see src/sqlite.rs).
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "serialize", "column_decltype", "ffi-sqlite-wasm-rs"] }
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "0.2"

# SQLite's host functions (clock, entropy, local time) come from JavaScript via wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sqlite-wasm-rs = { version = "0.6", default-features = false, features = ["wasm-bindgen"] }
