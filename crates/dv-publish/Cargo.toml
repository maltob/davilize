[package]
name = "dv-publish"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
opendal = { version = "0.59.5", features = ["services-fs", "services-s3", "services-memory"] }
# SFTP: pure-Rust SSH (russh, ring backend) and SFTP (russh-sftp). No external ssh binary.
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util"] }
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
url = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile.workspace = true
